<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Thanks for downloading RuForge</title>
<link rel="icon" type="image/png" href="assets/ruforge-logo.png" />
<link rel="stylesheet" href="colors_and_type.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { height: 100%; }
body { min-height: 100%; background: var(--rf-bg); color: var(--rf-text); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }

/* ── Orbs ── */
.glow { position: fixed; border-radius: 50%; pointer-events: none; filter: blur(90px); z-index: 0; animation: breathe linear infinite alternate; }
.glow-1 { width: 700px; height: 700px; left: -180px; top: -180px; background: rgba(237,215,156,0.04); animation-duration: 18s; }
.glow-2 { width: 550px; height: 550px; right: -120px; bottom: 0; background: rgba(237,215,156,0.028); animation-duration: 23s; }
.glow-3 { width: 360px; height: 360px; left: 40%; top: 50%; transform: translateX(-50%); background: rgba(237,215,156,0.02); animation-duration: 16s; }
@keyframes breathe { from { opacity: 0.55; transform: scale(0.97); } to { opacity: 1; transform: scale(1.07); } }

/* ── Grain ── */
.grain { position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.93 0 0 0 0 0.84 0 0 0 0 0.61 0 0 0 0.05 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>"); }

/* ── Header ── */
.header {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 100; display: flex; align-items: center; gap: 10px;
  padding: 7px 14px 7px 10px;
  background: rgba(39,28,24,0.82); border: 1px solid var(--rf-border);
  border-radius: var(--radius-pill); backdrop-filter: blur(14px);
  box-shadow: var(--shadow-pill);
}
.header img { width: 24px; height: 24px; border-radius: 5px; }
.header span { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--rf-text); }

/* ── Page ── */
.page { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; z-index: 1; padding: 100px 24px 80px; }

/* ── Main content ── */
.main-card { display: flex; flex-direction: column; align-items: center; text-align: center; width: 100%; max-width: 420px; }
.owl-img { display: block; object-fit: contain; filter: drop-shadow(0 16px 36px rgba(0,0,0,0.5)); }

.eyebrow { display: flex; align-items: center; gap: 10px; justify-content: center; font-weight: 900; font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; color: var(--rf-text-muted); margin-bottom: 12px; }
.eyebrow::before, .eyebrow::after { content: ''; display: block; height: 1px; width: 22px; background: var(--rf-border-strong); }

.headline { font-family: var(--font-display); font-weight: 700; font-size: clamp(30px, 4vw, 42px); line-height: 1.08; letter-spacing: -0.025em; color: var(--rf-text); }

/* ── Timeline ── */
.timeline { position: relative; width: 100%; max-width: 360px; display: flex; flex-direction: column; margin: 28px 0; text-align: left; }
.timeline::before { content: ''; position: absolute; left: 12px; top: 24px; bottom: 24px; width: 0; border-left: 1.5px dashed rgba(237,215,156,0.13); pointer-events: none; z-index: 0; }
.tl-item { display: flex; align-items: center; gap: 16px; padding: 12px 0; position: relative; z-index: 1; }
.tl-dot { width: 24px; height: 24px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.tl-dot.done    { background: rgba(127,198,106,0.15); border: 1.5px solid rgba(127,198,106,0.45); }
.tl-dot.active  { background: rgba(237,215,156,0.08); border: 1.5px solid rgba(237,215,156,0.3); }
.tl-dot.pending { background: var(--rf-bg); border: 1.5px solid rgba(237,215,156,0.12); }
.tl-label { flex: 1; font-size: 14px; font-weight: 500; }
.tl-label.done    { color: var(--rf-text-muted); }
.tl-label.active  { color: var(--rf-text); }
.tl-label.pending { color: var(--rf-text-faint); }
.tl-badge { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; }
.tl-badge.done   { background: rgba(127,198,106,0.12); color: var(--rf-add); }
.tl-badge.active { background: rgba(237,215,156,0.08); color: var(--rf-text-muted); border: 1px solid rgba(237,215,156,0.2); }

.link-row { display: flex; align-items: center; gap: 6px; margin-top: 16px; }
.link-row a { font-size: 12px; color: var(--rf-text-faint); text-decoration: none; transition: color 180ms; }
.link-row a:hover { color: var(--rf-text-muted); }
.link-sep { font-size: 11px; color: var(--rf-border-strong); }

/* ════════════════════════════════════
   MODAL
   ════════════════════════════════════ */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 400;
  background: rgba(15,10,8,0.72);
  backdrop-filter: blur(10px);
  display: flex; align-items: center; justify-content: center;
  padding: 24px;
  transition: opacity 360ms ease;
}
.modal-backdrop.hidden { opacity: 0; pointer-events: none; }

.modal {
  width: 100%; max-width: 400px;
  background: var(--rf-surface-2);
  border: 1px solid rgba(237,215,156,0.18);
  border-radius: 24px;
  box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 4px 16px rgba(0,0,0,0.4),
              inset 0 1px 0 rgba(237,215,156,0.08);
  overflow: hidden;
  transition: opacity 360ms ease, transform 360ms cubic-bezier(0.16,1,0.3,1);
  transform: scale(1) translateY(0);
}
.modal-backdrop.hidden .modal { opacity: 0; transform: scale(0.96) translateY(8px); }

/* Modal header strip */
.modal-header {
  display: flex; align-items: center; gap: 10px;
  padding: 16px 20px 0;
}
.modal-logo { width: 28px; height: 28px; border-radius: 7px; flex-shrink: 0; }
.modal-app-name { font-family: var(--font-display); font-weight: 700; font-size: 14px; color: var(--rf-text); flex: 1; }

/* Modal body */
.modal-body { padding: 16px 24px 22px; }

/* Progress ring + icon */
.ring-wrap {
  display: flex; align-items: center; justify-content: center;
  margin-bottom: 20px;
}
.ring-svg { transform: rotate(-90deg); }
.ring-track { fill: none; stroke: rgba(237,215,156,0.08); }
.ring-fill  {
  fill: none;
  stroke: url(#ringGrad);
  stroke-linecap: round;
  transition: stroke-dashoffset 300ms cubic-bezier(0.16,1,0.3,1);
}
.ring-fill.complete { stroke: rgba(127,198,106,0.9); }
.ring-icon {
  position: absolute;
  display: flex; align-items: center; justify-content: center;
}

/* File info */
.modal-filename { font-family: var(--font-mono); font-size: 13px; color: var(--rf-text); font-weight: 500; margin-bottom: 4px; text-align: center; }
.modal-filemeta { font-size: 12px; color: var(--rf-text-faint); margin-bottom: 20px; text-align: center; }

/* Single stat line */
.modal-stat-line { font-size: 12px; color: var(--rf-text-faint); text-align: center; margin-top: 4px; font-family: var(--font-mono); }

/* ── Demo ── */
.demo-bar {
  position: fixed; top: 20px; right: 20px; z-index: 500;
  display: flex; align-items: center; gap: 8px;
  padding: 6px 8px 6px 14px;
  background: rgba(39,28,24,0.9); border: 1px solid var(--rf-border);
  border-radius: var(--radius-pill); backdrop-filter: blur(14px);
  box-shadow: var(--shadow-pill);
}
.demo-label { font-size: 11px; color: var(--rf-text-faint); letter-spacing: 0.05em; }
.demo-btn { display: inline-flex; align-items: center; gap: 5px; padding: 5px 12px; border: none; border-radius: 999px; background: rgba(237,215,156,0.1); color: var(--rf-text-muted); font-family: var(--font-sans); font-size: 11px; font-weight: 500; cursor: pointer; transition: background 180ms, color 180ms; }
.demo-btn:hover { background: rgba(237,215,156,0.18); color: var(--rf-text); }
</style>
</head>
<body>
<div class="grain"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<header class="header">
  <img src="assets/ruforge-logo.png" alt="" />
  <span>RuForge</span>
</header>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const FILE_SIZE_MB  = 12.4;
const FILENAME      = "RuForgeSetup-v0.1.7.exe";
const RADIUS        = 40;
const CIRCUMFERENCE = 2 * Math.PI * RADIUS;

function fmtMB(mb)   { return mb.toFixed(1) + " MB"; }
function fmtSpd(mbs) { return mbs.toFixed(1) + " MB/s"; }

function Check({ size = 14, color = "currentColor" }) {
  return (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color}
         strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <path d="M20 6 9 17l-5-5"/>
    </svg>
  );
}

function ChevronRight() {
  return (
    <svg width="9" height="9" viewBox="0 0 24 24" fill="none"
         stroke="rgba(237,215,156,0.7)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round">
      <polyline points="9 18 15 12 9 6"/>
    </svg>
  );
}

/* ── Download modal ── */
function DownloadModal({ visible, progress, speed, downloaded, complete }) {
  const pct    = Math.min(100, Math.round(progress));
  const offset = CIRCUMFERENCE * (1 - pct / 100);

  return (
    <div className={`modal-backdrop${visible ? "" : " hidden"}`}>
      <div className="modal">
        {/* Header */}
        <div className="modal-header">
          <img className="modal-logo" src="assets/ruforge-logo.png" alt="" />
          <span className="modal-app-name">RuForge</span>
        </div>

        {/* Body */}
        <div className="modal-body">
          {/* Progress ring */}
          <div className="ring-wrap" style={{ position: "relative", width: 100, height: 100, margin: "0 auto 16px" }}>
            <svg className="ring-svg" width="100" height="100" viewBox="0 0 100 100">
              <defs>
                <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                  <stop offset="0%" stopColor="#c9b87a"/>
                  <stop offset="100%" stopColor="#edd79c"/>
                </linearGradient>
              </defs>
              <circle className="ring-track" cx="50" cy="50" r={RADIUS} strokeWidth="5"/>
              <circle
                className={`ring-fill${complete ? " complete" : ""}`}
                cx="50" cy="50" r={RADIUS} strokeWidth="5"
                strokeDasharray={CIRCUMFERENCE}
                strokeDashoffset={offset}
              />
            </svg>
            <div className="ring-icon" style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
              {complete
                ? <Check size={20} color="rgba(127,198,106,0.9)" />
                : <span style={{ fontFamily: "var(--font-display)", fontWeight: 700, fontSize: 15, color: "rgba(237,215,156,0.85)" }}>{pct}%</span>
              }
            </div>
          </div>

          {/* Single quiet label */}
          <p className="modal-stat-line">
            {complete ? "saved to your downloads folder" : "downloading..."}
          </p>
        </div>
      </div>
    </div>
  );
}

/* ── Root ── */
function App() {
  const [phase, setPhase]           = useState("downloading"); // "downloading"|"complete"
  const [modalVisible, setModalVisible] = useState(false);
  const [progress, setProgress]     = useState(0);
  const [speed, setSpeed]           = useState(2.4);
  const [downloaded, setDownloaded] = useState(0);
  const [modalDone, setModalDone]   = useState(false); // ring goes green briefly

  const rafRef = useRef(null);
  const dlRef  = useRef({ downloaded: 0, speed: 2.4, last: null });

  const startDownload = useCallback(() => {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    dlRef.current = { downloaded: 0, speed: 2.4, last: null };
    setPhase("downloading"); setProgress(0); setDownloaded(0); setSpeed(2.4);
    setModalDone(false);
    setTimeout(() => setModalVisible(true), 200);

    function tick(now) {
      const d = dlRef.current;
      if (!d.last) d.last = now;
      const dt = Math.min((now - d.last) / 1000, 0.12);
      d.last = now;
      const target = 1.8 + Math.random() * 5.2;
      d.speed = Math.max(0.8, Math.min(7.5, d.speed + (target - d.speed) * 0.1 + (Math.random() - 0.5) * 0.2));
      d.downloaded = Math.min(d.downloaded + d.speed * dt, FILE_SIZE_MB);
      const pct = (d.downloaded / FILE_SIZE_MB) * 100;
      setSpeed(d.speed); setDownloaded(d.downloaded); setProgress(pct);
      if (pct < 100) {
        rafRef.current = requestAnimationFrame(tick);
      } else {
        setProgress(100); setDownloaded(FILE_SIZE_MB);
        setModalDone(true);
        setTimeout(() => setModalVisible(false), 1400);
        setTimeout(() => setPhase("complete"), 1900);
      }
    }
    rafRef.current = requestAnimationFrame(tick);
  }, []);

  useEffect(() => {
    const t = setTimeout(startDownload, 400);
    return () => { clearTimeout(t); if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [startDownload]);

  function skipToComplete() {
    if (rafRef.current) cancelAnimationFrame(rafRef.current);
    setProgress(100); setDownloaded(FILE_SIZE_MB); setModalDone(true);
    setTimeout(() => setModalVisible(false), 1200);
    setTimeout(() => setPhase("complete"), 1700);
  }

  const steps = phase === "downloading"
    ? [
        { state: "active",  label: "Downloading…",       badge: null   },
        { state: "pending", label: "Run the installer",   badge: null   },
        { state: "pending", label: "Launch RuForge",      badge: null   },
      ]
    : [
        { state: "done",    label: "Download finished",   badge: "done" },
        { state: "active",  label: "Run the installer",   badge: "next" },
        { state: "pending", label: "Launch RuForge",      badge: null   },
      ];

  return (
    <>
      <div className="page">
        <div className="main-card">
          <img
            className="owl-img"
            src="uploads/254688.5_owl-removebg-preview.png"
            alt="RuForge owl"
            style={{ width: 160, height: 160, marginBottom: 24 }}
          />
          <div className="eyebrow">
            {phase === "downloading" ? "downloading" : "download complete"}
          </div>
          <h1 className="headline">thanks for downloading.</h1>

          <div className="timeline">
            {steps.map((s, i) => (
              <div className="tl-item" key={i}>
                <div className={`tl-dot ${s.state}`}>
                  {s.state === "done"   && <Check />}
                  {s.state === "active" && <ChevronRight />}
                </div>
                <span className={`tl-label ${s.state}`}>{s.label}</span>
                {s.badge && <span className={`tl-badge ${s.state}`}>{s.badge}</span>}
              </div>
            ))}
          </div>

          {phase === "complete" && (
            <a href="#" className="rf-btn" style={{ padding: "13px 28px", fontSize: "14px", fontWeight: 600, borderRadius: "13px", gap: 8 }}>
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
                <path d="M12 3v12m0 0 4-4m-4 4-4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
              </svg>
              Open installer
            </a>
          )}

          <div className="link-row">
            <a href="#">Changelog</a>
            <span className="link-sep">·</span>
            <a href="#">v0.1.7 notes</a>
            <span className="link-sep">·</span>
            <a href="#">Troubleshooting</a>
          </div>
        </div>
      </div>

      <DownloadModal
        visible={modalVisible}
        progress={progress}
        speed={speed}
        downloaded={downloaded}
        complete={modalDone}
      />

      <div className="demo-bar">
        <span className="demo-label">demo</span>
        {phase === "downloading"
          ? <button className="demo-btn" onClick={skipToComplete}>skip →</button>
          : <button className="demo-btn" onClick={startDownload}>↺ restart</button>
        }
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
