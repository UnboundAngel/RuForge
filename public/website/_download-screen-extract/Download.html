<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Download — RuForge</title>
<link rel="icon" type="image/png" href="assets/ruforge-logo.png" />
<link rel="stylesheet" href="colors_and_type.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--rf-bg);
  color: var(--rf-text);
  font-family: var(--font-sans);
  -webkit-font-smoothing: antialiased;
}

/* ── Glow orbs ── */
.glow {
  position: fixed;
  border-radius: 50%;
  pointer-events: none;
  filter: blur(90px);
  z-index: 0;
  animation: breathe linear infinite alternate;
}
.glow-1 { width: 700px; height: 700px; left: -160px; top: -160px; background: rgba(237,215,156,0.045); animation-duration: 18s; }
.glow-2 { width: 500px; height: 500px; right: -100px; bottom: 40px;  background: rgba(237,215,156,0.030); animation-duration: 23s; }
.glow-3 { width: 380px; height: 380px; left: 38%; top: 55%; transform: translateX(-50%); background: rgba(237,215,156,0.022); animation-duration: 16s; }
@keyframes breathe {
  from { opacity: 0.55; transform: scale(0.98); }
  to   { opacity: 1;    transform: scale(1.07); }
}

/* ── Grain ── */
.grain {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.93 0 0 0 0 0.84 0 0 0 0 0.61 0 0 0 0.055 0'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
}

/* ── Header pill ── */
.header {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
  z-index: 100;
  display: flex; align-items: center; gap: 4px;
  padding: 7px 8px 7px 12px;
  background: rgba(39,28,24,0.82);
  border: 1px solid var(--rf-border);
  border-radius: var(--radius-pill);
  backdrop-filter: blur(14px);
  box-shadow: var(--shadow-pill);
  white-space: nowrap;
}
.header-logo {
  display: flex; align-items: center; gap: 9px;
  text-decoration: none; margin-right: 8px;
}
.header-logo img { width: 26px; height: 26px; border-radius: 6px; }
.header-logo span {
  font-family: var(--font-display); font-weight: 700; font-size: 14px;
  color: var(--rf-text);
}
.header-nav { display: flex; align-items: center; }
.header-nav a {
  font-size: 13px; font-weight: 500; color: var(--rf-text-muted);
  text-decoration: none; padding: 5px 11px; border-radius: var(--radius-pill);
  transition: color 200ms ease;
}
.header-nav a:hover { color: var(--rf-text); }

/* ── Page layout ── */
.page {
  min-height: 100vh;
  display: flex; flex-direction: column; align-items: center;
  position: relative; overflow-x: hidden;
}

/* ── Main ── */
.main {
  flex: 1;
  width: 100%; max-width: 1080px;
  margin: 0 auto;
  padding: 110px 32px 64px;
  position: relative; z-index: 1;
}

/* ── Layout variants ── */
.layout-centered {
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}
.layout-split {
  display: grid;
  grid-template-columns: 1fr 1fr;
  align-items: center;
  gap: 64px;
  text-align: left;
}
.layout-split .owl-wrap { order: 2; justify-self: center; }
.layout-split .content  { order: 1; }
.layout-split .eyebrow  { justify-content: flex-start; }
.layout-split .eyebrow::before { display: none; }
.layout-split .sub      { max-width: none; }
.layout-split .cta-group { align-items: flex-start; }
.layout-split .meta     { justify-content: flex-start; }
.layout-split .reqs-card { margin-top: 40px; }

/* ── Owl ── */
.owl-wrap {
  position: relative;
  margin-bottom: 36px;
  display: flex; align-items: center; justify-content: center;
}
.owl-wrap img {
  object-fit: contain;
  filter: drop-shadow(0 24px 48px rgba(0,0,0,0.55));
  animation: float 6s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50%       { transform: translateY(-12px); }
}
.layout-split .owl-wrap { margin-bottom: 0; }

/* ── Eyebrow ── */
.eyebrow {
  display: flex; align-items: center; gap: 10px;
  font-family: var(--font-sans); font-weight: 900; font-size: 11px;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--rf-text-muted); margin-bottom: 18px;
  justify-content: center;
}
.eyebrow::before, .eyebrow::after {
  content: ''; display: block; height: 1px; width: 28px;
  background: var(--rf-border-strong);
}

/* ── Headline ── */
.headline {
  font-family: var(--font-display); font-weight: 700;
  font-size: clamp(38px, 5vw, 56px);
  line-height: 1.05; letter-spacing: -0.025em;
  color: var(--rf-text); margin-bottom: 18px;
}
.headline em { font-style: normal; color: var(--rf-text-muted); font-weight: 500; }

/* ── Sub ── */
.sub {
  font-size: 16px; font-weight: 400; color: var(--rf-text-muted);
  line-height: 1.7; max-width: 460px; margin-bottom: 40px;
}
.layout-centered .sub { margin-left: auto; margin-right: auto; }

/* ── CTA group ── */
.cta-group { display: flex; flex-direction: column; align-items: center; gap: 14px; }
.btn-row   { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.layout-split .btn-row { justify-content: flex-start; }

/* ── Primary download button (override base .rf-btn for size) ── */
.dl-btn {
  padding: 14px 30px; font-size: 15px; font-weight: 600;
  border-radius: 14px; gap: 10px; letter-spacing: -0.01em;
}
.dl-btn-ghost { padding: 13px 22px; font-size: 14px; font-weight: 500; }

/* ── Meta pill row ── */
.meta { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }
.version-badge {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 4px 12px;
  background: var(--rf-surface); border: 1px solid var(--rf-border);
  border-radius: var(--radius-pill);
  font-family: var(--font-mono); font-size: 12px; color: var(--rf-text-muted);
}
.live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--rf-add); flex-shrink: 0; }
.meta-sep { color: var(--rf-border-strong); font-size: 13px; }
.meta-txt { font-size: 12px; color: var(--rf-text-faint); }

/* ── Requirements card ── */
.reqs-card {
  margin-top: 56px;
  background: var(--rf-surface);
  border: 1px solid var(--rf-border);
  border-radius: 20px;
  padding: 24px 36px;
  display: flex; gap: 0; flex-wrap: wrap;
  width: 100%; max-width: 580px;
}
.layout-centered .reqs-card { margin-left: auto; margin-right: auto; }
.req-item {
  flex: 1; min-width: 110px;
  display: flex; flex-direction: column; gap: 5px;
  padding: 0 16px;
  border-right: 1px solid var(--rf-border);
}
.req-item:first-child { padding-left: 0; }
.req-item:last-child  { border-right: none; }
.req-label {
  font-family: var(--font-sans); font-weight: 900; font-size: 10px;
  letter-spacing: 0.18em; text-transform: uppercase; color: var(--rf-text-faint);
}
.req-value { font-size: 13px; font-weight: 500; color: var(--rf-text-muted); }

/* ── Footer ── */
.footer {
  position: relative; z-index: 1;
  padding: 24px 32px; text-align: center;
  font-size: 12px; color: var(--rf-text-faint);
  border-top: 1px solid var(--rf-border);
  width: 100%; margin-top: 32px;
}
.footer a { color: var(--rf-text-muted); text-decoration: none; transition: color 180ms; }
.footer a:hover { color: var(--rf-text); }

/* ── Divider inside reqs card on mobile ── */
@media (max-width: 600px) {
  .req-item { border-right: none; border-bottom: 1px solid var(--rf-border); padding: 12px 0; }
  .req-item:last-child { border-bottom: none; }
  .layout-split { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="grain"></div>
<div class="glow glow-1"></div>
<div class="glow glow-2"></div>
<div class="glow glow-3"></div>

<!-- Header -->
<header class="header">
  <a class="header-logo" href="#">
    <img src="assets/ruforge-logo.png" alt="RuForge" />
    <span>RuForge</span>
  </a>
  <nav class="header-nav">
    <a href="#">Changelog</a>
    <a href="#">Roadmap</a>
    <a href="#">Legal</a>
  </nav>
  <a href="#" class="rf-btn" style="padding: 8px 18px; font-size: 13px; border-radius: 10px; margin-left: 6px;">
    Download
  </a>
</header>

<!-- React root -->
<div id="root"></div>

<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "layout": "split",
  "owlSize": 300,
  "showReqs": false,
  "headline": "Download RuForge."
}/*EDITMODE-END*/;

function DownloadPage() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  const layout = t.layout;
  const owlSize = t.owlSize;

  return (
    <>
      <div className="page">
        <main className="main">
          <div className={layout === "split" ? "layout-split" : "layout-centered"}>

            {/* Owl */}
            <div className="owl-wrap">
              <img
                src="uploads/254688.5_owl-removebg-preview.png"
                alt="RuForge owl mascot"
                style={{ width: owlSize, height: owlSize }}
              />
            </div>

            {/* Content */}
            <div className="content">
              <div className="eyebrow">available now</div>

              <h1 className="headline">
                {t.headline}<br />
                <em>it's free.</em>
              </h1>

              <p className="sub">
                A lightweight, local-first media collector for Windows. yt-dlp downloading,
                offline playback, SponsorBlock, chapters, and subtitles — no ads, no cloud, no fuss.
              </p>

              <div className="cta-group">
                <div className="btn-row">
                  <a href="#" className="rf-btn dl-btn">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.75" strokeLinecap="round" strokeLinejoin="round">
                      <path d="M12 3v12m0 0 4-4m-4 4-4-4"/>
                      <path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/>
                    </svg>
                    Download for Windows
                  </a>
                  <a href="https://github.com/UnboundAngel/RuForge" className="rf-btn-ghost dl-btn-ghost">
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
                      <path d="M12 2C6.477 2 2 6.484 2 12.021c0 4.428 2.865 8.184 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.001 10.001 0 0022 12.021C22 6.484 17.523 2 12 2z"/>
                    </svg>
                    GitHub Source
                  </a>
                </div>

                <div className="meta">
                  <span className="version-badge">
                    <span className="live-dot"></span>
                    v0.1.7
                  </span>
                  <span className="meta-sep">·</span>
                  <span className="meta-txt">Windows 10 / 11</span>
                  <span className="meta-sep">·</span>
                  <span className="meta-txt">~12 MB</span>
                </div>
              </div>

              {/* Requirements */}
              {t.showReqs && (
                <div className="reqs-card">
                  <div className="req-item">
                    <span className="req-label">Platform</span>
                    <span className="req-value">Windows 10 / 11 (x64)</span>
                  </div>
                  <div className="req-item">
                    <span className="req-label">Runtime</span>
                    <span className="req-value">WebView2</span>
                  </div>
                  <div className="req-item">
                    <span className="req-label">Size</span>
                    <span className="req-value">~12 MB</span>
                  </div>
                  <div className="req-item">
                    <span className="req-label">License</span>
                    <span className="req-value">MIT</span>
                  </div>
                </div>
              )}
            </div>
          </div>
        </main>

        <footer className="footer">
          <p>built with yt-dlp, FFmpeg, Tauri, and Rust &nbsp;·&nbsp; <a href="https://github.com/UnboundAngel/RuForge">open source on GitHub</a></p>
        </footer>
      </div>

      <TweaksPanel>
        <TweakSection label="Layout" />
        <TweakRadio label="Style" value={t.layout} options={["centered", "split"]} onChange={v => setTweak("layout", v)} />
        <TweakSection label="Mascot" />
        <TweakSlider label="Owl size" value={t.owlSize} min={160} max={380} step={10} onChange={v => setTweak("owlSize", v)} />
        <TweakSection label="Content" />
        <TweakText label="Headline" value={t.headline} onChange={v => setTweak("headline", v)} />
        <TweakToggle label="Show requirements" value={t.showReqs} onChange={v => setTweak("showReqs", v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<DownloadPage />);
</script>
</body>
</html>
