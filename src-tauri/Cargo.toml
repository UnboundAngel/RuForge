[package]
name = "ruforge"
version = "0.2.2"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "ruforge"

[workspace]
members = [".", "netscape_cookies", "telemetry_scrub"]

[workspace.dependencies]
netscape_cookies = { path = "netscape_cookies" }
telemetry_scrub = { path = "telemetry_scrub" }

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ruforge_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "unstable"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
tauri-plugin-snap-layout = "1.0.8"
tauri-plugin-aptabase = "1.0"

tauri-plugin-shell = "2.3.5"
tauri-plugin-clipboard-manager = "2"
log = "0.4"
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
cookie = "0.18"
netscape_cookies = { workspace = true }
telemetry_scrub = { workspace = true }
lofty = { version = "0.22", default-features = false }
trash = "5"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
drag = "2.1.1"
png = "0.18.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
axum = "0.7"
tower = { version = "0.4", default-features = false, features = ["util"] }
tower-http = { version = "0.5", features = ["fs"] }
hmac = "0.12"
rand = "0.8"
base64 = "0.22"
rust-embed = "8"

[features]
default = []
dev-verify-bins = []

[dev-dependencies]

[[bin]]
name = "verify_track_enrich"
path = "dev-bin/verify_track_enrich.rs"
required-features = ["dev-verify-bins"]

[[bin]]
name = "verify_gallery_folder"
path = "dev-bin/verify_gallery_folder.rs"
required-features = ["dev-verify-bins"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_Controls",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

