[package]
name = "rf_listen_harness"
version = "0.0.0"
edition = "2021"

[workspace]
members = ["tauri_stub", "tauri_macros_stub"]

[dependencies]
tauri = { path = "tauri_stub" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
